# 美股財報爬蟲 / 選股 / 回測設定
# API 金鑰請設環境變數 FMP_API_KEY，不要寫在這裡。

fmp:
  base_url: https://financialmodelingprep.com/stable
  # 每分鐘請求上限：免費方案每日 250 次，Starter 300 次/分，依方案調整
  requests_per_minute: 250
  timeout: 30
  max_retries: 3

storage:
  db_path: data/usequity.db

crawl:
  # 股票池：sp500 / nasdaq100 / dowjones / list（使用下方 symbols）
  universe: list
  symbols: [AAPL, MSFT, GOOGL, AMZN, META, NVDA, JPM, JNJ, XOM, PG, KO, WMT, HD, UNH, V]
  # 財報期別：quarter 可算 TTM 與較即時的點時資料；免費方案可能只開放 annual
  period: quarter
  statement_limit: 40          # 每種報表抓幾期（40 季 ≈ 10 年）
  price_start: "2014-01-01"
  benchmark: SPY
  # 快取有效期（小時），期間內不重抓
  ttl_hours:
    statements: 168
    prices: 20
    profile: 720

screen:
  # 硬性篩選條件（全部 AND），欄位名稱見 README「可用因子」
  filters:
    - "market_cap > 10e9"
    - "roe > 0.10"
    - "debt_to_equity < 2"
  # 排名權重：正值越大越好，負值越小越好
  rank:
    earnings_yield: 1.0
    fcf_yield: 1.0
    roe: 1.0
    gross_margin: 0.5
    revenue_growth: 0.5
    momentum_12_1: 1.0
  top_n: 5

backtest:
  start: "2016-01-01"
  end: null                    # null = 資料最後一天
  rebalance: quarterly         # monthly / quarterly / annual
  weighting: equal             # equal / rank
  cost_bps: 10                 # 單邊交易成本（基點）
  # 財報若無 filingDate，假設報告期結束後多少天才公開，避免前視偏差
  filing_lag_days: 45
