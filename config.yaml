# 美股財報爬蟲 / 選股 / 回測設定
# API 金鑰請設環境變數 FMP_API_KEY，不要寫在這裡。

fmp:
  base_url: https://financialmodelingprep.com/stable
  # 每分鐘請求上限：免費方案每日 250 次，Starter 300 次/分，依方案調整
  requests_per_minute: 250
  timeout: 30
  max_retries: 3

storage:
  db_path: data/usequity.db

crawl:
  # 股票池：sp500 / nasdaq100 / dowjones / list（使用下方 symbols）
  universe: list
  # 美股大型股 40 檔，涵蓋各產業。
  # 免費方案並非所有代號都開放（實測 PG、HD、AVGO、ORCL、CRM、QCOM、TXN 回 402，已移除）；
  # 其他不開放的代號會自動記錄，30 天內不再嘗試。
  # 額度估算（免費方案每日 250 次）：首次每檔約 6 次；之後每次排程每檔約 2 次（股價、市值），
  # 財報每週更新一次時再加 3 次 → 40 檔每週最多約 200 次。要再加檔數，請先確認不會超過每日上限。
  symbols: [
    # 科技 / 通訊
    AAPL, MSFT, GOOGL, AMZN, META, NVDA, ADBE, AMD, CSCO, INTC, NFLX, IBM,
    # 金融
    JPM, V, MA, BAC, GS, BRK-B,
    # 醫療
    JNJ, UNH, LLY, ABBV, MRK, TMO, ABT, PFE,
    # 消費
    KO, PEP, WMT, COST, MCD, NKE, DIS, TSLA,
    # 能源 / 工業
    XOM, CVX, CAT, HON, UNP, LIN,
  ]
  # 財報期別：annual / quarter
  # 免費方案每種報表最多 5 期（程式會自動調降 limit）：年報 = 5 年，季報只有 5 季（僅夠算 2 期 TTM）
  # 所以免費方案建議 annual；付費方案可改 quarter + 40（≈ 10 年），財報更即時
  period: annual
  statement_limit: 40
  price_start: "2014-01-01"
  benchmark: SPY
  # 快取有效期（小時），期間內不重抓
  ttl_hours:
    statements: 144            # 6 天：每週六排程會重抓財報，週三那次沿用
    prices: 20
    profile: 720

screen:
  # 硬性篩選條件（全部 AND），欄位名稱見 README「可用因子」
  filters:
    - "market_cap > 10e9"
    - "roe > 0.10"
    - "debt_to_equity < 2"
  # 排名權重：正值越大越好，負值越小越好
  rank:
    earnings_yield: 1.0
    fcf_yield: 1.0
    roe: 1.0
    gross_margin: 0.5
    revenue_growth: 0.5
    momentum_12_1: 1.0
  top_n: 5

backtest:
  start: "2016-01-01"
  end: null                    # null = 資料最後一天
  rebalance: quarterly         # monthly / quarterly / annual
  weighting: equal             # equal / rank
  cost_bps: 10                 # 單邊交易成本（基點）
  # 財報若無 filingDate，假設報告期結束後多少天才公開，避免前視偏差
  filing_lag_days: 45
